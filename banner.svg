<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260">
  <defs>
    <!-- background hitam pekat (dengan nuansa ungu sangat gelap) -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#000000"/>
      <stop offset="50%" stop-color="#0B0714"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <!-- glow ungu lembut di belakang teks -->
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-opacity" values="0.35;0.15;0.35" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- teks berkilau (putih → ungu → cyan) -->
    <linearGradient id="shine" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="250,0;-250,0;250,0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- background hitam -->
  <rect width="1200" height="260" fill="url(#bg)"/>
  <ellipse cx="600" cy="100" rx="500" ry="170" fill="url(#glow)"/>

  <!-- bintang kelap-kelip -->
  <circle cx="80"  cy="60"  r="2.5" fill="#E9D5FF"><animate attributeName="opacity" values="0;1;0" dur="2.2s" begin="0.0s" repeatCount="indefinite"/></circle>
  <circle cx="230" cy="40"  r="2"   fill="#E9D5FF"><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="0.4s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="90"  r="2"   fill="#E9D5FF"><animate attributeName="opacity" values="0;1;0" dur="2.0s" begin="0.8s" repeatCount="indefinite"/></circle>
  <circle cx="610" cy="30"  r="2.5" fill="#E9D5FF"><animate attributeName="opacity" values="0;1;0" dur="2.4s" begin="1.1s" repeatCount="indefinite"/></circle>
  <circle cx="780" cy="80"  r="2"   fill="#E9D5FF"><animate attributeName="opacity" values="0;1;0" dur="2.8s" begin="0.2s" repeatCount="indefinite"/></circle>
  <circle cx="950" cy="45"  r="2.5" fill="#E9D5FF"><animate attributeName="opacity" values="0;1;0" dur="2.1s" begin="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="1100" cy="95" r="2"   fill="#E9D5FF"><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.6s" repeatCount="indefinite"/></circle>
  <circle cx="170" cy="150" r="1.8" fill="#C4B5FD"><animate attributeName="opacity" values="0;1;0" dur="3.0s" begin="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="160" r="1.8" fill="#C4B5FD"><animate attributeName="opacity" values="0;1;0" dur="2.3s" begin="0.9s" repeatCount="indefinite"/></circle>
  <circle cx="1000" cy="140" r="2"  fill="#C4B5FD"><animate attributeName="opacity" values="0;1;0" dur="2.7s" begin="1.3s" repeatCount="indefinite"/></circle>

  <!-- partikel melayang ke atas -->
  <circle cx="150" cy="205" r="4" fill="#A78BFA" opacity="0.6"><animateTransform attributeName="transform" type="translate" values="0,0;0,-30;0,0" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="195" r="3" fill="#818CF8" opacity="0.6"><animateTransform attributeName="transform" type="translate" values="0,0;0,-26;0,0" dur="5.5s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="200" r="4" fill="#A78BFA" opacity="0.6"><animateTransform attributeName="transform" type="translate" values="0,0;0,-32;0,0" dur="6.5s" repeatCount="indefinite"/></circle>
  <circle cx="1050" cy="185" r="3" fill="#818CF8" opacity="0.6"><animateTransform attributeName="transform" type="translate" values="0,0;0,-24;0,0" dur="5.0s" repeatCount="indefinite"/></circle>

  <!-- teks utama (putih berkilau) -->
  <text x="600" y="118" text-anchor="middle" font-family="'Courier New',monospace" font-size="80" font-weight="bold" fill="url(#shine)">xymz</text>
  <text x="600" y="162" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" fill="#9CA3AF">Python &amp; Web Developer &#128013;  &#183;  Automation &amp; Bots &#129302;</text>

  <!-- gelombang bawah (animasi bergeser pelan) -->
  <path d="M0,260 L0,225 C100,205 200,245 300,225 C400,205 500,245 600,225 C700,205 800,245 900,225 C1000,205 1100,245 1200,225 L1200,260 Z" fill="#7C3AED" opacity="0.3">
    <animateTransform attributeName="transform" type="translate" values="0,0;-40,0;0,0" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M0,260 L0,242 C150,265 300,220 450,242 C600,265 750,220 900,242 C1050,265 1200,220 1200,242 L1200,260 Z" fill="#4C1D95" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="0,0;40,0;0,0" dur="9s" repeatCount="indefinite"/>
  </path>
</svg>
