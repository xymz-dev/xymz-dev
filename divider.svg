<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60">
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#A78BFA;#22D3EE" dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- latar hitam (biar nyatu sama tema) -->
  <rect x="0" y="0" width="1200" height="60" fill="#000000"/>

  <rect x="120" y="28" width="960" height="4" rx="2" fill="url(#bar)"/>

  <!-- titik berjalan bolak-balik di atas garis -->
  <circle cx="120" cy="30" r="14" fill="#22D3EE" opacity="0.25">
    <animate attributeName="cx" values="120;1080;120" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="120" cy="30" r="7" fill="#22D3EE">
    <animate attributeName="cx" values="120;1080;120" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
